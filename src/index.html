<!-- Example of how you implement a webcomponent in a website -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Hello World!</title>
</head>

<body>
<h1>Road traffic events</h1>

Code Snippet for web build:
<pre style="overflow: hidden">
  <code>
    &lt;noi-a22-road-events style="height: 600px; width: 100%;"&gt;&lt;/noi-a22-road-events&gt;

    &lt;script type="module" src="./noi-a22-road-events.js"&gt;&lt;/script&gt;
  </code>
</pre>


Output:

<!--  <hello-world name="Hello World!"></hello-world>-->
<noi-a22-road-events id="webcam" style="height: 600px; width: 100%"></noi-a22-road-events>

<script nomodule src="./noi-a22-road-events.js"></script>
<script type="module" src="./noi-a22-road-events.esm.js"></script>


<div>
  <div class="btn-group">
    <div class="btn-group__name">Size</div>
    <button onclick="webcam.style.width = '500px'">mobile</button>
    <button onclick="webcam.style.width = '890px'">tablet</button>
    <button onclick="webcam.style.width = '100%'">full</button>
    <button onclick="webcam.style.width = '968px'; webcam.style.height = '800px'">preview</button>
  </div>
  <div class="btn-group">
    <div class="btn-group__name">layout</div>
    <button onclick="webcam.layout = 'mobile'">mobile</button>
    <button onclick="webcam.layout = 'tablet'">tablet</button>
    <button onclick="webcam.layout = 'desktop'">desktop</button>
    <button onclick="webcam.layout = 'auto'">auto</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">language</div>
    <button onclick="webcam.language = 'en'">lang: en</button>
    <button onclick="webcam.language = 'it'">lang: it</button>
    <button onclick="webcam.language = 'xx'">lang: xx (missing)</button>
    <button onclick="webcam.language = null">lang: auto</button>
  </div>

  <div class="btn-group">
    <div class="btn-group__name">styles</div>
    <button onclick="webcam.classList.remove('dark-mode','alt-mode')">styles: default</button>
    <button onclick="webcam.classList.remove('dark-mode','alt-mode'); webcam.classList.add('dark-mode')">styles: dark mode</button>
    <button onclick="webcam.classList.remove('dark-mode','alt-mode'); webcam.classList.add('dark-mode', 'alt-mode')">styles: dark alt mode</button>
  </div>

  <!-- font size     -->
  <script>
      function changeFontSize(change) {
        const currentSize = parseInt(webcam.style.fontSize || '16px', 10);
        webcam.style.fontSize = (currentSize + change) + 'px';
      }
    </script>
    <div class="btn-group">
      <div class="btn-group__name">actions</div>
      <button onclick="changeFontSize(-1)">font -</button>
      <button onclick="changeFontSize(1)">font +</button>
      <button onclick="webcam.refreshData()">refreshData</button>
    </div>

</div>
<div style="height: 8px"></div>
<div class="btn-group">
  <div class="btn-group__name">filters</div>
  <button onclick="webcam.direction = 'north'">d: north</button>
  <button onclick="webcam.direction = 'south'">d: south</button>
  <button onclick="webcam.direction = 'both'">d: both</button>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
<style>
  noi-a22-road-events {
    font-family: "Roboto", serif;
    outline: 1px solid red;
    margin: 5px auto;
  }

  noi-a22-road-events.dark-mode {
    font-family: "Roboto", serif;
    outline: 1px solid red;

    --color-primary: rgb(224, 224, 224);
    --color-secondary: rgb(23, 162, 184);
    --color-text: #FFF;
    --color-background: #333;
    --color-shade: #555;
    --color-border: #A0A0A0;
    --map-marker-highlight: var(--color-secondary);
    --map-line-color: #5d8d58;
    --map-marker-color-bg: #282828;
    --list-highlight: #FAFAFA;
    --map-filter: grayscale(100%) invert(1);
    --scrollbar-color: #CCC;
    --scrollbar-bg: #333;
  }

  noi-a22-road-events.dark-mode::part(panel) {
    box-shadow: 0 4px 20px 0 rgba(255, 255, 255, 0.25);
  }
  noi-a22-road-events.dark-mode::part(menu-btn) {
    box-shadow: 0 4px 20px 0 rgba(255, 255, 255, 0.25);
    border: 1px solid #A0A0A0;
  }
  noi-a22-road-events.dark-mode::part(list-item-selected) {
    border-color: var(--color-secondary);
  }

  /* alternative dark mode */
  noi-a22-road-events.alt-mode::part(list-item) {
    border: 0;
  }
  noi-a22-road-events.alt-mode::part(list-item-selected) {
    --list-color-text: var(--color-background);
    --list-color-background: var(--color-text);
  }
  noi-a22-road-events.alt-mode::part(map-item-selected) {
    --map-marker-color: var(--color-text);
  }
</style>


<style>
  .btn-group {
    display: inline-flex;
    align-items: center;
    gap: 0.5ch;
    position: relative;

    padding: 4px;
    padding-bottom: 3ch;
    margin: 2px;
    border: 1px solid gray;
    border-radius: 4px;
  }

  .btn-group .btn-group__name {
    padding: 4px;
    padding-right: 1ch;

    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    text-transform: lowercase;
  }
</style>

</body>

</html>
